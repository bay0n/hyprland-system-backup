# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock        # avoids starting multiple instances
    before_sleep_cmd = loginctl lock-session      # lock before the PC actually suspends
    after_sleep_cmd =  hyprctl dispatch dpms on    # ensures screen wakes up after PC sleep
}

# 10 seconds after the screen is LOCKED -> suspend the whole PC (not just screen off)
listener {
    timeout = 10                                             # 10 seconds
    on-timeout = pidof hyprlock && systemctl suspend           # suspend ONLY if locked
    on-resume = hyprctl dispatch dpms on                       # wake screen on resume
}

# 30 minutes of general inactivity (whether locked or not) -> just blank the screen,
# don't suspend the machine
listener {
    timeout = 1800                              # 30 minutes
    on-timeout = hyprctl dispatch dpms off       # screen off only
    on-resume = hyprctl dispatch dpms on         # wake on input
}
