# ~/.config/hypr/hyprlock.conf

$backgroundPath = ~/Pictures/wallpapers/pixel_sakura_static.png

# ---- palette pulled directly from the SDDM theme's pixel_sakura.conf ----
$text_color     = rgb(3d495b)
$field_color    = rgb(cccccc)
$placeholder    = rgb(bbbbbb)
$accent         = rgb(3d495b)
$accent_hover   = rgb(697f90)

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = $backgroundPath
    blur_passes = 0
    blur_size = 0
    noise = 0.0117
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ---- Clock, matches HourFormat="HH:mm" ----
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text_color
    font_size = 90
    font_family = ArcadeClassic
    position = 0, 160
    halign = center
    valign = center
}

# ---- Date, matches DateFormat="dddd d" ----
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %-d')"
    color = $text_color
    font_size = 22
    font_family = ArcadeClassic
    position = 0, 60
    halign = center
    valign = center
}



# ---- Password field ----
# HaveFormBackground=false in the SDDM theme -> fully transparent panel,
# just a soft pill-shaped input like the original.
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $field_color
    font_color = $text_color
    fade_on_empty = false
    placeholder_text = <span foreground="##bbbbbb">Password...</span>
    hide_input = false
    rounding = 20
    check_color = $accent_hover
    fail_color = rgb(c0392b)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(c0392b)
    position = 0, -90
    halign = center
    valign = center
}
